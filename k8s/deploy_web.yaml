apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-nginx-deployment
spec:
  selector:
    matchLabels:
      app: web
  replicas: 3
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: thtieig/nginxcustom:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: http-lb
  labels:
    app: web
spec:
  type: LoadBalancer
  ports:
  - port: 80
  selector:
    app: web